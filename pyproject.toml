[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerialsim"
version = "0.1.0"
description = "Greek airspace 3D-graph simulation environment for civil ATM scenarios with live weather"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "plotly>=5.0",
    "PyYAML>=6.0",
    "requests>=2.28",
]

[tool.setuptools]
packages = ["aerialsim"]
