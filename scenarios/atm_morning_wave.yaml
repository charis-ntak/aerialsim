  - { callsign: AEE710, aircraft: a320,  from: LGAV, to: LGIR, dep_time_min: 4 }
  - { callsign: RYR184, aircraft: b738,  from: LGRP, to: LGAV, dep_time_min: 0 }
  - { callsign: AEE642, aircraft: e190,  from: LGIR, to: LGTS, dep_time_min: 13 }
  - { callsign: SEH512, aircraft: atr72, from: LGKR, to: LGAV, dep_time_min: 2 }
  - { callsign: OAL358, aircraft: a320,  from: LGTS, to: LGSR, dep_time_min: 8 }
